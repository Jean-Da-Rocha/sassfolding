# Only esbuild needs its install script, to download the platform binary Vite relies on.
# The others ship prebuilt native bindings, so their scripts are pure overhead.
allowBuilds:
  '@tailwindcss/oxide': false
  esbuild: true
  unrs-resolver: false
  vue-demi: false

overrides:
  eslint-plugin-perfectionist: 5.3.1
  '@internationalized/date': ~3.12.4
